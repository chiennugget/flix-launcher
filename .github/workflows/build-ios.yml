name: Build iOS app

on:
  push:
    branches: [main, "claude/**"]
    paths:
      - "ios/**"
      - ".github/workflows/build-ios.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    env:
      VERSION: 1.0.${{ github.run_number }}
      BUILD: ${{ github.run_number }}
      TAG: build-${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: ios
        run: xcodegen generate

      - name: Build (unsigned; SideStore signs it on your phone)
        working-directory: ios
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
        run: |
          xcodebuild -project Flix.xcodeproj -scheme Flix -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            MARKETING_VERSION="$VERSION" CURRENT_PROJECT_VERSION="$BUILD" \
            TMDB_API_KEY="$TMDB_API_KEY" \
            -quiet build

      - name: Package Flix.ipa and apps.json
        working-directory: ios
        run: |
          mkdir -p dist/Payload
          cp -R build/Build/Products/Release-iphoneos/Flix.app dist/Payload/
          (cd dist && zip -qry Flix.ipa Payload)
          python3 scripts/make_source.py dist/Flix.ipa "$VERSION" "$BUILD" "$TAG" dist/apps.json

      - uses: actions/upload-artifact@v4
        with:
          name: Flix-${{ env.VERSION }}
          path: |
            ios/dist/Flix.ipa
            ios/dist/apps.json

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$TAG" ios/dist/Flix.ipa ios/dist/apps.json \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --latest \
            --title "Flix $VERSION" \
            --notes "Built from ${GITHUB_REF_NAME} at ${GITHUB_SHA::7}. Install or update through SideStore using the source https://github.com/${GITHUB_REPOSITORY}/releases/latest/download/apps.json"
