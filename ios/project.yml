name: Flix
options:
  bundleIdPrefix: io.github.chiennugget
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    # Optional: CI fills this from the TMDB_API_KEY secret. A key typed into
    # the app's Settings always wins.
    TMDB_API_KEY: ""
targets:
  Flix:
    type: application
    platform: iOS
    sources:
      - path: Flix
    scheme: {}
    info:
      path: Support/Info.plist
      properties:
        CFBundleDisplayName: Flix
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        TMDBAPIKey: $(TMDB_API_KEY)
        UILaunchScreen: {}
        UIUserInterfaceStyle: Dark
        UIApplicationSupportsIndirectInputEvents: true
        UIBackgroundModes: [audio]
        ITSAppUsesNonExemptEncryption: false
        LSApplicationQueriesSchemes: [brave]
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.chiennugget.flix
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: NO
